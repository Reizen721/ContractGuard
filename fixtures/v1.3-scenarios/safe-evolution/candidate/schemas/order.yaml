type: object
additionalProperties: false
required: [orderId, status, items, totalCents]
properties:
  orderId:
    type: string
  status:
    type: string
    enum: [pending, paid, cancelled]
  items:
    type: array
    minItems: 1
    items:
      $ref: ./line-item.yaml
  totalCents:
    type: integer
    minimum: 0
  customerNote:
    type: [string, "null"]
    maxLength: 200
