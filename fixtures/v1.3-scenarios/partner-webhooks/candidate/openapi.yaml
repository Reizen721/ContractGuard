openapi: 3.1.0
info:
  title: Partner delivery integration API
  version: '2026.10'
  description: Partner onboarding, outbound notifications and delivery receipt lookup.
servers:
  - url: https://partners.example.invalid/v2
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /partners:
    $ref: ./paths/partners.yaml
  /partners/{partnerId}:
    $ref: ./paths/partner.yaml
  /deliveries/{deliveryId}:
    $ref: ./paths/delivery.yaml
webhooks:
  orderCreated:
    $ref: ./notifications/order-created.yaml
