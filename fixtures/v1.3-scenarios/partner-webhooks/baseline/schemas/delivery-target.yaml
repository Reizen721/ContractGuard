oneOf:
  - type: object
    additionalProperties: false
    required: [kind, address]
    properties:
      kind:
        type: string
        enum: [email]
      address:
        type: string
  - type: object
    additionalProperties: false
    required: [kind, url]
    properties:
      kind:
        type: string
        enum: [http]
      url:
        type: string
